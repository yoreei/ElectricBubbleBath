name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build (Release x64)
        run: msbuild ElectricBubbleBath.sln -p:Configuration=Release -p:Platform=x64 -m

      - name: Upload game
        uses: actions/upload-artifact@v4
        with:
          name: ElectricBubbleBath-win64
          path: |
            x64/Release/ElectricBubbleBath.exe
            x64/Release/irrKlang.dll
            x64/Release/assets/
